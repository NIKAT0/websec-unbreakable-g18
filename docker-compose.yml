# Unbreakable achter de WAF (BunkerWeb 1.6.15).
# Enkel BunkerWeb staat open naar buiten (80 en 443). De app, de databank en Keycloak hebben geen ports.

x-bw-api-env: &bw-api-env
  # Enkel de scheduler (netwerk bw-universe) mag de API van BunkerWeb aanspreken
  API_WHITELIST_IP: "127.0.0.0/8 10.20.30.0/24"

services:
  app:
    build: ./app
    # Geen ports: de app is enkel bereikbaar via BunkerWeb (netwerk bw-services)
    environment:
      ConnectionStrings__Unbreakable: "Host=db;Port=5432;Database=unbreakable;Username=unbreakable;Password=Unbr3akable!2026"
      # De PDP (OpenFGA): adres, store en model. De app is enkel PEP.
      OpenFga__ApiUrl: "http://openfga:8080"
      OpenFga__StoreId: "01M82QE9KT7D57EBDDHJM4CGE3"
      OpenFga__ModelId: "01M82QFKCVNJJZKGKT6SFTG1HR"
    depends_on:
      - db
      - openfga
    restart: unless-stopped
    networks:
      - bw-services
      - app-db
      - app-openfga

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: unbreakable
      POSTGRES_USER: unbreakable
      POSTGRES_PASSWORD: Unbr3akable!2026
    volumes:
      - dbdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - app-db

  # Identity provider (OIDC). Draait intern, enkel bereikbaar via BunkerWeb op /auth.
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: start --import-realm
    environment:
      # Databank (eigen Postgres, los van de app)
      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://keycloak-db:5432/keycloak"
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: "K3ycl0ak!2026"
      # Eerste beheerder (enkel voor de setup; login gebeurt via de realm)
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: "Adm1n!Keycloak2026"
      # Achter BunkerWeb: TLS termineert op de WAF, Keycloak draait op subpad /auth
      KC_HOSTNAME: "https://g18.ipv6.thelastgym.be/auth"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      # Frontend-URL's blijven de publieke hostname; backchannel (bv. de API die de
      # sleutels ophaalt) gebruikt de interne host. Zo hoeft de API niet via de WAF.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      # Realm, client en testgebruikers worden bij de start geïmporteerd
      - ./keycloak/import:/opt/keycloak/data/import:ro
    depends_on:
      - keycloak-db
    restart: unless-stopped
    networks:
      - bw-services
      - keycloak-net

  keycloak-db:
    image: postgres:17
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: "K3ycl0ak!2026"
    volumes:
      - kcdbdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - keycloak-net

  # Policy Decision Point (PDP): OpenFGA (ReBAC, op basis van Google Zanzibar).
  # Intern, enkel bereikbaar voor de app (PEP) via het netwerk app-openfga.
  openfga:
    image: openfga/openfga:v1.8.0
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: "postgres://openfga:0p3nFGA!2026@openfga-db:5432/openfga?sslmode=disable"
      OPENFGA_LOG_LEVEL: warn
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - openfga-net
      - app-openfga

  # Eenmalige databankmigratie voor OpenFGA (maakt de tabellen aan).
  openfga-migrate:
    image: openfga/openfga:v1.8.0
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: "postgres://openfga:0p3nFGA!2026@openfga-db:5432/openfga?sslmode=disable"
    depends_on:
      - openfga-db
    restart: "no"
    networks:
      - openfga-net

  openfga-db:
    image: postgres:17
    environment:
      POSTGRES_DB: openfga
      POSTGRES_USER: openfga
      POSTGRES_PASSWORD: "0p3nFGA!2026"
    volumes:
      - openfgadbdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - openfga-net

  bunkerweb:
    image: bunkerity/bunkerweb:1.6.15@sha256:1b96f672660cc32bfae93604ac297371222dc9039b2b09b8eee5e40ba9d35c35
    ports:
      - "80:8080/tcp"
      - "443:8443/tcp"
    environment:
      <<: *bw-api-env
    restart: unless-stopped
    networks:
      - bw-universe
      - bw-services

  bw-scheduler:
    image: bunkerity/bunkerweb-scheduler:1.6.15@sha256:321867d8db44d3a4ca1edfa3ff2c5b50163d3ebd5c67ed0d107161319d5ee860
    depends_on:
      - bunkerweb
    environment:
      <<: *bw-api-env
      BUNKERWEB_INSTANCES: "bunkerweb"
      SERVER_NAME: "g18.ipv6.thelastgym.be"
      # Reverse proxy naar de app (hoofdsite)
      USE_REVERSE_PROXY: "yes"
      REVERSE_PROXY_HOST: "http://app:8080"
      REVERSE_PROXY_URL: "/"
      # De app gebruikt DELETE (bericht verwijderen); standaard laat BunkerWeb dat niet toe.
      ALLOWED_METHODS: "GET|POST|HEAD|DELETE"
      # Tweede reverse proxy: /auth naar Keycloak (zelfde pad als KC_HTTP_RELATIVE_PATH)
      REVERSE_PROXY_HOST_1: "http://keycloak:8080"
      REVERSE_PROXY_URL_1: "/auth"
      # HTTPS via Let's Encrypt: eerst staging (gedeelde limiet), daarna "no"
      AUTO_LETS_ENCRYPT: "yes"
      USE_LETS_ENCRYPT_STAGING: "no"
      # BunkerWeb ziet elke bezoeker als het IP van de Docker-gateway (IPv6 via docker-proxy).
      # Een ban zou dus iedereen treffen: bad behavior uit (zie threat model).
      USE_BAD_BEHAVIOR: "no"
    volumes:
      - bw-storage:/data   # databank van BunkerWeb, met de certificaten
    restart: unless-stopped
    networks:
      - bw-universe

volumes:
  dbdata:
  kcdbdata:
  openfgadbdata:
  bw-storage:

networks:
  # De databank is enkel bereikbaar voor de app en heeft geen internet
  app-db:
    internal: true
  # Keycloak en zijn databank, intern
  keycloak-net:
    internal: true
  # OpenFGA en zijn eigen databank, intern
  openfga-net:
    internal: true
  # Enkel de app (PEP) bereikt de PDP; intern, geen internet
  app-openfga:
    internal: true
  bw-universe:
    ipam:
      config:
        - subnet: 10.20.30.0/24
  bw-services:
